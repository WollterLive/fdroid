name: Publish F-Droid repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fdroidserver
        run: |
          sudo add-apt-repository -y ppa:fdroid/fdroidserver
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Restore signing key
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
        run: echo "$FDROID_KEYSTORE" | base64 -d > fdroid/keystore.p12

      - name: Generate index
        working-directory: fdroid
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          chmod 600 config.yml keystore.p12
          fdroid update --create-metadata --pretty --use-date-from-apk
          rm keystore.p12

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r fdroid/repo _site/repo
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
